# GitLab CI mirror of .github/workflows/ci.yml.
#
# The project is hosted on GitHub, but the same check/test gate and a tagged Linux build
# run on GitLab without changes. GitLab-specific features (FUNDING.yml, GitHub release
# assets) are simply ignored by GitLab.
#
# Release flow:
#   1. GitHub Actions builds and publishes the Linux/macOS/Windows archives on the tag.
#   2. GitLab builds Linux natively and mirrors the macOS/Windows archives from the
#      GitHub release into the GitLab Generic Package Registry (permanent, no expiry).
#   3. The GitLab release links all four archives plus SHA256SUMS.txt.

stages:
  - check
  - test
  - package
  - publish
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: rust:1.86
  interruptible: true
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      curl pkg-config
      libxkbcommon-dev libwayland-dev libx11-dev libxi-dev
      libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

check:
  stage: check
  script:
    - cargo check --workspace --all-targets --locked

test:
  stage: test
  script:
    - cargo test --workspace --locked

package:
  stage: package
  needs: ["check", "test"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --locked -p lucid -p lucid-forge
    - version="${CI_COMMIT_TAG#v}"
    - name="lucid-${version}-x86_64-unknown-linux-gnu"
    - mkdir -p "dist/${name}"
    - cp target/release/lucid target/release/lucid-forge README.md LICENSE CHANGELOG.md "dist/${name}/"
    - tar -czf "dist/${name}.tar.gz" -C dist "${name}"
  artifacts:
    name: "lucid-${CI_COMMIT_TAG}-linux"
    paths:
      - dist/*.tar.gz
    expire_in: 1 week

publish:
  stage: publish
  needs: ["package"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - version="${CI_COMMIT_TAG#v}"
    - mkdir -p release
    - cp "dist/lucid-${version}-x86_64-unknown-linux-gnu.tar.gz" release/
    - |
      ready=0
      for attempt in $(seq 1 60); do
        missing=0
        for f in \
          "lucid-${version}-aarch64-apple-darwin.tar.gz" \
          "lucid-${version}-x86_64-apple-darwin.tar.gz" \
          "lucid-${version}-x86_64-pc-windows-msvc.zip" \
          "SHA256SUMS.txt"; do
          if ! curl -fsSIL "https://github.com/Gishi1/lucid/releases/download/${CI_COMMIT_TAG}/${f}" >/dev/null; then
            missing=1
            break
          fi
        done
        if [ "${missing}" = "0" ]; then ready=1; break; fi
        echo "Waiting for GitHub release assets (attempt ${attempt}/60)..."
        sleep 20
      done
      test "${ready}" = "1"
    - |
      for f in \
        "lucid-${version}-aarch64-apple-darwin.tar.gz" \
        "lucid-${version}-x86_64-apple-darwin.tar.gz" \
        "lucid-${version}-x86_64-pc-windows-msvc.zip" \
        "SHA256SUMS.txt"; do
        curl -fsSL "https://github.com/Gishi1/lucid/releases/download/${CI_COMMIT_TAG}/${f}" -o "release/${f}"
      done
    - cd release
    - grep -v 'x86_64-unknown-linux-gnu' SHA256SUMS.txt > SHA256SUMS.github
    - sha256sum -c SHA256SUMS.github
    - sha256sum lucid-*.tar.gz lucid-*.zip > SHA256SUMS.txt
    - |
      for f in lucid-*.tar.gz lucid-*.zip SHA256SUMS.txt; do
        echo "Uploading ${f}"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${f}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lucid/${CI_COMMIT_TAG}/${f}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["publish"]
  before_script: []
  cache: {}
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - version="${CI_COMMIT_TAG#v}"
    - base="${CI_PROJECT_URL}/-/packages/generic/lucid/${CI_COMMIT_TAG}"
    - |
      release-cli create \
        --name "Lucid ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "See CHANGELOG.md. Linux, macOS and Windows archives are attached below; verify them with SHA256SUMS.txt." \
        --assets-link "{\"name\":\"Linux x86_64\",\"url\":\"${base}/lucid-${version}-x86_64-unknown-linux-gnu.tar.gz\"}" \
        --assets-link "{\"name\":\"macOS arm64\",\"url\":\"${base}/lucid-${version}-aarch64-apple-darwin.tar.gz\"}" \
        --assets-link "{\"name\":\"macOS x86_64\",\"url\":\"${base}/lucid-${version}-x86_64-apple-darwin.tar.gz\"}" \
        --assets-link "{\"name\":\"Windows x86_64\",\"url\":\"${base}/lucid-${version}-x86_64-pc-windows-msvc.zip\"}" \
        --assets-link "{\"name\":\"SHA256SUMS.txt\",\"url\":\"${base}/SHA256SUMS.txt\"}"
